<svg xmlns="http://www.w3.org/2000/svg"
	width="1080" height="640" viewBox="0 0 1080 640"
	role="img" aria-labelledby="title description">
	<title id="title">spack storage comparison across four corpora</title>
	<desc id="description">
		Original logical string storage compared with packed storage, split into
		the byte blob and five-byte pointers. All bars share one scale.
		Common Crawl saves 15.08%, joaat.sh saves 49.74%,
		OpenStreetMap saves 74.06%, and Wikidata saves 67.12%.
		Original storage includes string payload, sixteen bytes per input
		string header, and a twenty-four-byte slice header.
	</desc>

	<style>
		text {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
			fill: #344054;
			font-size: 13px;
			font-variant-numeric: tabular-nums;
		}

		.heading {
			font-size: 23px;
			font-weight: 650;
			letter-spacing: -0.4px;
		}

		.subtitle, .detail, .axis, .note, .row-label {
			fill: #667085;
		}

		.name {
			font-size: 15px;
			font-weight: 600;
		}

		.count, .saving {
			font-size: 12px;
		}

		.saving {
			fill: #467464;
			font-weight: 600;
		}

		.value {
			font-size: 14px;
			font-weight: 600;
		}

		.row-label, .axis, .note {
			font-size: 12px;
		}

		.original { fill: #a9b5c5; }
		.blob { fill: #8db9a6; }
		.pointers { fill: #d5a3ad; }

		.grid {
			stroke: #667085;
			stroke-opacity: 0.14;
			stroke-width: 1;
		}

		.separator {
			stroke: #667085;
			stroke-opacity: 0.18;
			stroke-width: 1;
		}

		@media (prefers-color-scheme: dark) {
			text { fill: #e0e5ec; }

			.subtitle, .detail, .axis, .note, .row-label {
			fill: #a8b2c0;
			}

			.saving { fill: #a3cdb9; }

			.grid, .separator {
			stroke: #a8b2c0;
			stroke-opacity: 0.18;
			}
		}
	</style>

	<!-- Transparent background: no full-canvas rectangle. -->
	<text x="24" y="34" class="heading">Less memory. Same strings.</text>
	<text x="24" y="58" class="subtitle">
		Logical original storage versus packed blob + pointers · Same scale across all corpora
	</text>

	<!-- Legend -->
	<rect x="24" y="82" width="14" height="14" rx="1" class="original" />
	<text x="46" y="94">Logical original</text>

	<rect x="214" y="82" width="14" height="14" rx="1" class="blob" />
	<text x="236" y="94">Packed blob</text>

	<rect x="384" y="82" width="14" height="14" rx="1" class="pointers" />
	<text x="406" y="94">Pointers · 5 bytes per input (Pointer32)</text>

	<!-- Global scale: 160 pixels per decimal GB. -->
	<g class="grid">
		<line x1="225" y1="130" x2="225" y2="546" />
		<line x1="385" y1="130" x2="385" y2="546" />
		<line x1="545" y1="130" x2="545" y2="546" />
		<line x1="705" y1="130" x2="705" y2="546" />
		<line x1="865" y1="130" x2="865" y2="546" />
		<line x1="945" y1="130" x2="945" y2="546" />
	</g>

	<!-- Common Crawl -->
	<g>
		<text x="24" y="154" class="name">Common Crawl</text>
		<text x="24" y="175" class="count">50.0M URLs</text>
		<text x="24" y="198" class="saving">15.08% saved</text>

		<text x="210" y="161" text-anchor="end" class="row-label">Original</text>
		<rect x="225" y="146" width="693.315" height="22" rx="1" class="original" />
		<text x="929" y="162" class="value">4.333 GB</text>

		<text x="210" y="189" text-anchor="end" class="row-label">Packed</text>
		<rect x="225" y="174" width="548.775" height="22" rx="1" class="blob" />
		<rect x="773.775" y="174" width="40" height="22" rx="1" class="pointers" />
		<text x="824" y="190" class="value">3.680 GB</text>

		<text x="225" y="216" class="detail">Blob 3.430 GB + pointers 250 MB</text>
	</g>

	<!-- joaat.sh -->
	<g>
		<text x="24" y="260" class="name">joaat.sh</text>
		<text x="24" y="281" class="count">81.8M unique strings</text>
		<text x="24" y="304" class="saving">49.74% saved</text>

		<text x="210" y="267" text-anchor="end" class="row-label">Original</text>
		<rect x="225" y="252" width="487.659" height="22" rx="1" class="original" />
		<text x="723" y="268" class="value">3.048 GB</text>

		<text x="210" y="295" text-anchor="end" class="row-label">Packed</text>
		<rect x="225" y="280" width="179.631" height="22" rx="1" class="blob" />
		<rect x="404.631" y="280" width="65.476" height="22" rx="1" class="pointers" />
		<text x="480" y="296" class="value">1.532 GB</text>

		<text x="225" y="322" class="detail">Blob 1.123 GB + pointers 409.23 MB</text>
	</g>

	<!-- OpenStreetMap -->
	<g>
		<text x="24" y="366" class="name">OpenStreetMap</text>
		<text x="24" y="387" class="count">50.0M tag values</text>
		<text x="24" y="410" class="saving">74.06% saved</text>

		<text x="210" y="373" text-anchor="end" class="row-label">Original</text>
		<rect x="225" y="358" width="212.540" height="22" rx="1" class="original" />
		<text x="448" y="374" class="value">1.328 GB</text>

		<text x="210" y="401" text-anchor="end" class="row-label">Packed</text>
		<rect x="225" y="386" width="15.140" height="22" rx="1" class="blob" />
		<rect x="240.140" y="386" width="40" height="22" rx="1" class="pointers" />
		<text x="290" y="402" class="value">344.62 MB</text>

		<text x="225" y="428" class="detail">Blob 94.62 MB + pointers 250 MB</text>
	</g>

	<!-- Wikidata -->
	<g>
		<text x="24" y="472" class="name">Wikidata</text>
		<text x="24" y="493" class="count">50.0M labels / aliases</text>
		<text x="24" y="516" class="saving">67.12% saved</text>

		<text x="210" y="479" text-anchor="end" class="row-label">Original</text>
		<rect x="225" y="464" width="284.482" height="22" rx="1" class="original" />
		<text x="520" y="480" class="value">1.778 GB</text>

		<text x="210" y="507" text-anchor="end" class="row-label">Packed</text>
		<rect x="225" y="492" width="53.534" height="22" rx="1" class="blob" />
		<rect x="278.534" y="492" width="40" height="22" rx="1" class="pointers" />
		<text x="329" y="508" class="value">584.59 MB</text>

		<text x="225" y="534" class="detail">Blob 334.59 MB + pointers 250 MB</text>
	</g>

	<!-- Axis -->
	<g class="axis" text-anchor="middle">
		<text x="225" y="570">0</text>
		<text x="385" y="570">1 GB</text>
		<text x="545" y="570">2 GB</text>
		<text x="705" y="570">3 GB</text>
		<text x="865" y="570">4 GB</text>
		<text x="945" y="570">4.5 GB</text>
	</g>

	<line x1="24" y1="590" x2="1056" y2="590" class="separator" />

	<text x="24" y="612" class="note">
		Original = payload + 16 bytes per input + 24 bytes. Packed = blob + 5 bytes per input.
	</text>
	<text x="24" y="630" class="note">
		Savings include pointers. Logical representation sizes, not peak heap. Decimal MB / GB;
		labels rounded.
	</text>
</svg>