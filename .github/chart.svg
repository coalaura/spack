<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" aria-labelledby="title desc" viewBox="0 0 1120 700"><desc id="desc">Logical original storage compared with the packed representation. Each packed bar is split into a certified minimum blob, the remaining unresolved gap down to that minimum, and fixed five-byte pointers.</desc><defs><pattern id="gapPattern" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><path fill="#b37a1c" d="M0 0h8v8H0z"/><path stroke="#f6d8a4" stroke-width="3" d="M0 0v8" opacity=".75"/></pattern></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#e0e5ec;font-size:13px;font-variant-numeric:tabular-nums}.axis,.detail,.muted,.row-label{fill:#a8b2c0}.name{font-size:16px;font-weight:650}.meta{font-size:12px}.gapbadge,.saved{font-size:12px;font-weight:650}.saved{fill:#a3cdb9}.gapbadge{fill:#f0c36e}.value{font-size:14px;font-weight:650}</style><text x="36" y="34" style="font-size:24px;font-weight:700;letter-spacing:-.4px">Less memory. Same strings.</text><text x="36" y="60" style="fill:#a8b2c0">Packed bars are split into certified minimum blob + unresolved gap + fixed pointers</text><path fill="#a9b5c5" d="M36 80h14v14H36z"/><text x="58" y="92">Logical original</text><path fill="#7faa96" d="M222 80h14v14h-14z"/><text x="244" y="92">Certified minimum blob</text><path fill="url(#gapPattern)" stroke="#f0c36e" d="M466 80h14v14h-14z"/><text x="488" y="92">Unresolved gap (at most removable)</text><path fill="#d5a3ad" d="M790 80h14v14h-14z"/><text x="812" y="92">Pointers · 5 bytes per input</text><path stroke="#a8b2c0" stroke-opacity=".18" d="M270 130v490m160-490v490m160-490v490m160-490v490m160-490v490m80-490v490"/><text x="36" y="168" class="name">Common Crawl</text><text x="36" y="188" class="meta muted">50.0M URLs</text><text x="36" y="208" class="saved">15.08% saved</text><text x="36" y="228" class="gapbadge">0.00014% blob gap</text><text x="25