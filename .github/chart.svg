ddle">4.5 GB</text><path stroke="#a8b2c0" stroke-opacity=".18" d="M36 666h1048"/><text x="36" y="682" class="detail">Original = payload + 16 bytes per input + 24 bytes. Packed = certified minimum blob + unresolved gap + 5-byte pointers. Decimal MB / GB.</text></svg>