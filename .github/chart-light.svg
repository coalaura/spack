<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" aria-labelledby="title description" viewBox="0 0 1080 640"><desc id="description">Original logical string storage compared with packed storage, split into
		the byte blob and five-byte pointers. All bars share one scale.
		Common Crawl saves 15.08%, joaat.sh saves 49.74%,
		OpenStreetMap saves 74.06%, and Wikidata saves 67.12%.
		Original storage includes string payload, sixteen bytes per input
		string header, and a twenty-four-byte slice header.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#344054;font-size:13px;font-variant-numeric:tabular-nums}.detail,.note,.row-label{fill:#667085}.name{font-size:15px;font-weight:600}.count,.saving{font-size:12px}.saving{fill:#467464;font-weight:600}.value{font-size:14px;font-weight:600}.note,.row-label{font-size:12px}.original{fill:#a9b5c5}.blob{fill:#8db9a6}.pointers{fill:#d5a3ad}</style><text x="24" y="34" style="font-size:23px;font-weight:650;letter-spacing:-.4px">Less memory. Same strings.</text><text x="24" y="58" style="fill:#667085">
		Logical original storage versus packed blob + pointers · Same scale across all corpora
	</text><rect width="14" height="14" x="24" y="82" class="original" rx="1"/><text x="46" y="94">Logical original</text><rect width="14" height="14" x="214" y="82" class="blob" rx="1"/><text x="236" y="94">Packed blob</text><rect width="14" height="14" x="384" y="82" class="pointers" rx="1"/><text x="406" y="94">Pointers · 5 bytes per input (Pointer32)</text><path d="M225 130v416m160-416v416m160-416v416m160-416v416m160-416v416m80-416v416" style="stroke:#667085;stroke-opacity:.14;stroke-width:1"/><text x="24" y="154" class="name">Common Crawl</text><text x="24" y="175" class="count">50.0M URLs</text><text x="24" y="198" class="saving">15.08% saved</text><text x="210" y="161" class="row-label" text-anchor="end">Original</text><rect width="693.315" height="22" x="225" y="146" class="original" rx="1"/><text x="929" y="162" class="value">4.333 GB</text><text x="210" y="189" class="row-label" text-anchor="end">Packed</text><rect width="548.775" height="22" x="225" y="174" class="blob" rx="1"/><rect width="40" height="22" x="773.775" y="174" class="pointers" rx="1"/><text x="824" y="190" class="value">3.680 GB</text><text x="225" y="216" class="detail">Blob 3.430 GB + pointers 250 MB</text><text x="24" y="260" class="name">joaat.sh</text><text x="24" y="281" class="count">81.8M unique strings</text><text x="24" y="304" class="saving">49.74% saved</text><text x="210" y="267" class="row-label" text-anchor="end">Original</text><rect width="487.659" height="22" x="225" y="252" class="original" rx="1"/><text x="723" y="268" class="value">3.048 GB</text><text x="210" y="295" class="row-label" text-anchor="end">Packed</text><rect width="179.631" height="22" x="225" y="280" class="blob" rx="1"/><rect width="65.476" height="22" x="404.631" y="280" class="pointers" rx="1"/><text x="480" y="296" class="value">1.532 GB</text><text x="225" y="322" class="detail">Blob 1.123 GB + pointers 409.23 MB</text><text x="24" y="366" class="name">OpenStreetMap</text><text x="24" y="387" class="count">50.0M tag values</text><text x="24" y="410" class="saving">74.06% saved</text><text x="210" y="373" class="row-label" text-anchor="end">Original</text><rect width="212.54" height="22" x="225" y="358" class="original" rx="1"/><text x="448" y="374" class="value">1.328 GB</text><text x="210" y="401" class="row-label" text-anchor="end">Packed</text><rect width="15.14" height="22" x="225" y="386" class="blob" rx="1"/><rect width="40" height="22" x="240.14" y="386" class="pointers" rx="1"/><text x="290" y="402" class="value">344.62 MB</text><text x="225" y="428" class="detail">Blob 94.62 MB + pointers 250 MB</text><text x="24" y="472" class="name">Wikidata</text><text x="24" y="493" class="count">50.0M labels / aliases</text><text x="24" y="516" class="saving">67.12% saved</text><text x="210" y="479" class="row-label" text-anchor="end">Original</text><rect width="284.482" height="22" x="225" y="464" class="original" rx="1"/><text x="520" y="480" class="value">1.778 GB</text><text x="210" y="507" class="row-label" text-anchor="end">Packed</text><rect width="53.534" height="22" x="225" y="492" class="blob" rx="1"/><rect width="40" height="22" x="278.534" y="492" class="pointers" rx="1"/><text x="329" y="508" class="value">584.59 MB</text><text x="225" y="534" class="detail">Blob 334.59 MB + pointers 250 MB</text><g style="fill:#667085;font-size:12px" text-anchor="middle"><text x="225" y="570">0</text><text x="385" y="570">1 GB</text><text x="545" y="570">2 GB</text><text x="705" y="570">3 GB</text><text x="865" y="570">4 GB</text><text x="945" y="570">4.5 GB</text></g><path d="M24 590h1032" style="stroke:#667085;stroke-opacity:.18;stroke-width:1"/><text x="24" y="612" class="note">
		Original = payload + 16 bytes per input + 24 bytes. Packed = blob + 5 bytes per input.
	</text><text x="24" y="630" class="note">
		Savings include pointers. Logical representation sizes, not peak heap. Decimal MB / GB;
		labels rounded.
	</text></svg>